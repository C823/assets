/* Powerhouse intro */
#splash{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:'Barlow','Segoe UI',Roboto,Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;transition:opacity .6s ease}

.sp-logos{display:flex;align-items:center;gap:min(8vw,130px);height:min(34vh,30vw);margin-top:-4vh}
.sp-logos img{height:100%;width:auto;max-width:32vw;object-fit:contain;opacity:0;animation:spIn 1s ease-out .2s forwards}#sp_p{animation-delay:.55s}#sp_c{height:118%}

.spin{position:absolute;right:3vw;bottom:3.5vh;width:min(6.5vh,68px);height:min(6.5vh,68px);border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;animation:spRot 1s linear infinite}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(900px 500px at 0% -10%,rgba(59,130,246,.10),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(245,158,11,.06),transparent 60%);background-attachment:fixed;color:var(--text);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
input,select{font-family:inherit;font-size:inherit}
.num,.tbl td,.kpi b{font-variant-numeric:tabular-nums}
.h{font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-style:italic;margin:0}
h1.h{font-size:28px}h2.h{font-size:18px;margin-bottom:12px}h3.h{font-size:14px;margin-bottom:10px;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}.sm{font-size:12px}.xs{font-size:11px}
.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}
.mt{margin-top:14px}.mb{margin-bottom:14px}

/* Buttons */
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;transition:transform .05s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--panel3);border-color:#34425f}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--acc1),var(--acc2));border-color:#b45309;color:#1a1204}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#fbbf24,var(--acc1))}
.btn.danger{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.45);color:#fda4af}
.btn.green{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.45);color:#86efac}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn.big{padding:13px 22px;font-size:16px;border-radius:10px}
.btn.full{width:100%}
.chip{background:var(--panel2);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--text);color:#0a0e15;border-color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* Cards */
.card{background:linear-gradient(180deg,var(--panel),#121825);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi b{font-size:20px;font-weight:800}
.bar{height:8px;background:var(--panel3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc1),var(--gold));border-radius:99px}

/* Tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(38,50,74,.6);white-space:nowrap}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl tr.me td{background:rgba(245,158,11,.08)}
.tbl .r{text-align:right}.tbl .c{text-align:center}
.pos{display:inline-block;min-width:30px;text-align:center;font-size:11px;font-weight:800;padding:2px 5px;border-radius:5px;background:var(--panel3);color:var(--muted)}
.ovr{display:inline-block;min-width:32px;text-align:center;border-radius:6px;font-weight:800;padding:2px 6px;font-size:13px}
.o90{background:linear-gradient(180deg,#fde68a,#f59e0b);color:#1a1204}.o80{background:#16a34a;color:#fff}.o70{background:#2563eb;color:#fff}.o60{background:#475569;color:#fff}.o0{background:#334155;color:#cbd5e1}
.grade{font-weight:800}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;text-transform:uppercase;letter-spacing:.04em}
.tag.inj{background:rgba(244,63,94,.18);color:#fda4af}.tag.st{background:rgba(251,191,36,.16);color:var(--gold)}.tag.rk{background:rgba(59,130,246,.18);color:#93c5fd}.tag.exp{background:rgba(148,163,184,.18);color:#cbd5e1}

/* Title */
.title-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(180deg,rgba(10,14,21,.2),rgba(10,14,21,.95)),repeating-linear-gradient(90deg,#0e2a17 0 60px,#103019 60px 120px);}
.title-card{width:100%;max-width:520px;background:rgba(15,21,32,.92);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo-big{display:flex;flex-direction:column;align-items:center;line-height:.9;margin-bottom:6px}
.logo-big span{font-size:44px;font-weight:900;font-style:italic;letter-spacing:.02em;background:linear-gradient(180deg,#fff,#cbd5e1);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-big b{font-size:30px;font-weight:900;font-style:italic;letter-spacing:.32em;color:var(--acc1);padding-left:.32em}
.tagline{text-align:center;color:var(--muted);margin:10px 0 22px}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:16px 0 6px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;outline:none}
.inp:focus{border-color:var(--acc1)}
.opts{display:grid;gap:8px}
.opts.c3{grid-template-columns:repeat(3,1fr)}.opts.c2{grid-template-columns:repeat(2,1fr)}.opts.c4{grid-template-columns:repeat(4,1fr)}
.opt{background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:14px}.opt span{font-size:12px;color:var(--muted)}
.opt.on{border-color:var(--acc1);background:rgba(245,158,11,.08)}
.or{text-align:center;color:var(--dim);font-size:12px;margin:14px 0 0}

/* Brand / topbar */
.brand{font-weight:900;font-style:italic;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--acc1);margin-left:4px;letter-spacing:.14em}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 18px;background:rgba(10,14,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--tc1),var(--tc2))}
.tb-team{display:flex;align-items:center;gap:10px;min-width:0}
.tb-team .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stats{display:flex;gap:18px;margin-left:auto}
.tb-stats div{display:flex;flex-direction:column;align-items:flex-end}
.tb-stats label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.tb-stats b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{background:var(--panel2);border:1px solid var(--line);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px;flex:none}
.layout{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 57px)}
.nav{padding:14px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.nav button{background:none;border:none;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.06em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.nav button:hover{background:var(--panel);color:var(--text)}
.nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--acc1)}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--acc1);margin-left:auto}
.main{padding:20px;min-width:0;max-width:1280px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}

/* Team picker */
.pick-wrap{max-width:1280px;margin:0 auto;padding:24px 16px}
.pick-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.pick-head p{max-width:640px}
.cashbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:right}
.cashbox label{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.06em}
.cashbox b{font-size:24px;font-weight:900;color:var(--good)}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.team-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.tcard-band{position:absolute;left:0;right:0;top:0;height:70px;background:linear-gradient(120deg,var(--c1),var(--c1) 60%,var(--c2));opacity:.35}
.tcard-top{position:relative;display:flex;gap:12px;align-items:center}
.tname{font-size:18px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.1}
.tovr{margin-left:auto;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);font-weight:700}
.tovr .ovr{font-size:18px;padding:4px 8px}
.tcard-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative}
.tcard-stats div{background:var(--panel2);border-radius:8px;padding:6px;text-align:center}
.tcard-stats label{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.05em}
.tcard-stats b{font-size:13px}
.tcard-players{font-size:12px;display:flex;flex-direction:column;gap:4px}
.tcard-players div{display:flex;align-items:center;gap:6px}
.tcard-players .ovr{font-size:11px;min-width:26px;padding:1px 4px}
.badge{flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}

/* Home */
.hero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);padding:20px;background:linear-gradient(110deg,var(--tc1),rgba(20,27,40,.9) 55%),var(--panel);margin-bottom:14px}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.025) 60px 61px);pointer-events:none}
.hero-in{position:relative;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .tname{font-size:30px}
.hero .ratings{display:flex;gap:10px;margin-left:auto}
.rating-box{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 12px;text-align:center;min-width:64px}
.rating-box label{display:block;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rating-box b{font-size:22px;font-weight:900}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 0}
.mu-team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mu-team .tname{font-size:16px}
.mu-vs{font-weight:900;font-style:italic;color:var(--dim);font-size:22px}
.news{display:flex;flex-direction:column;gap:2px;max-height:330px;overflow:auto}
.news div{padding:7px 8px;border-left:3px solid var(--line);font-size:13px;background:rgba(255,255,255,.015);border-radius:0 6px 6px 0}
.news div.good{border-color:var(--good);color:var(--text)}.news div.bad{border-color:var(--bad);color:var(--text)}.news div.gold{border-color:var(--gold);color:var(--text)}
.news small{color:var(--dim);margin-right:6px}
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.score{background:var(--panel2);border-radius:8px;padding:6px 8px;font-size:12px}
.score div{display:flex;justify-content:space-between;gap:6px}
.score .w{font-weight:800}.score .l{color:var(--muted)}

/* Live game */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.94);overflow:auto;padding:16px}
.live{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.scorebug{display:grid;grid-template-columns:1fr auto 1fr;background:#05070b;border:1px solid #2a3550;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sb-team{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(90deg,var(--c),rgba(0,0,0,.6));min-width:0}
.sb-team.home{flex-direction:row-reverse;background:linear-gradient(270deg,var(--c),rgba(0,0,0,.6))}
.sb-abbr{font-size:22px;font-weight:900;font-style:italic;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.sb-rec{font-size:11px;color:rgba(255,255,255,.7)}
.sb-score{margin-left:auto;font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(0,0,0,.6);min-width:56px;text-align:center}
.sb-team.home .sb-score{margin-left:0;margin-right:auto}
.sb-poss{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);flex:none}
.sb-poss.off{visibility:hidden}
.sb-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 18px;background:#0b0f17;border-left:1px solid #2a3550;border-right:1px solid #2a3550}
.sb-q{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.sb-clock{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.dd{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;flex-wrap:wrap}
.dd b{font-size:16px}
.dd .dd-down{background:var(--gold);color:#111;font-weight:900;padding:3px 10px;border-radius:6px;font-style:italic}
.field{display:grid;grid-template-columns:8% 1fr 8%;height:140px;border-radius:10px;overflow:hidden;border:3px solid #e5e7eb33;box-shadow:inset 0 0 40px rgba(0,0,0,.4)}
.ez{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-weight:900;font-style:italic;letter-spacing:.12em;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-transform:uppercase;overflow:hidden}
.ez-l{transform:rotate(180deg)}
.turf{position:relative;background:repeating-linear-gradient(90deg,#1f7a36 0 5%,#1b6f31 5% 10%);}
.turf .yl{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
.turf .yn{position:absolute;bottom:6px;transform:translateX(-50%);font-weight:900;font-size:13px;color:rgba(255,255,255,.75)}
.turf .yn.t{top:6px;bottom:auto}
.turf .hash{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(255,255,255,.25)}
.los{position:absolute;top:0;bottom:0;width:3px;background:#3b82f6;box-shadow:0 0 6px #3b82f6;transition:left .35s}
.fdl{position:absolute;top:0;bottom:0;width:3px;background:#facc15;box-shadow:0 0 6px #facc15;transition:left .35s}
.fball{position:absolute;top:50%;width:18px;height:11px;margin:-6px 0 0 -9px;background:radial-gradient(ellipse at 40% 35%,#a0522d,#5c2c0e);border-radius:50%;border:1px solid #2b1406;transition:left .35s;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.fball::after{content:"";position:absolute;left:5px;right:5px;top:4px;height:1px;background:#fff;opacity:.8}
.lastplay{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;min-height:48px;display:flex;align-items:center}
.lastplay.td{border-color:var(--gold);background:linear-gradient(90deg,rgba(251,191,36,.18),var(--panel));font-weight:800}
.lastplay.fg{border-color:var(--good)}
.lastplay.to{border-color:var(--bad);background:linear-gradient(90deg,rgba(244,63,94,.14),var(--panel))}
.calls{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.call{background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.call:hover:not(:disabled){border-color:var(--acc1)}
.call:disabled{opacity:.4;cursor:not-allowed}
.call b{font-size:14px}.call span{font-size:11px;color:var(--muted)}
.call.sug{border-color:rgba(245,158,11,.6)}
.pbp{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:280px;overflow:auto}
.pbp div{padding:6px 12px;border-bottom:1px solid rgba(38,50,74,.5);font-size:13px;display:flex;gap:10px}
.pbp div small{color:var(--dim);min-width:58px;font-variant-numeric:tabular-nums}
.pbp .td{color:var(--gold);font-weight:700}.pbp .fg{color:var(--good)}.pbp .to{color:#fda4af}.pbp .info{color:var(--muted);font-style:italic}
.final-banner{text-align:center;font-weight:900;font-style:italic;font-size:22px;letter-spacing:.08em}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{max-width:900px}
.toast-root{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:#111827;border:1px solid var(--line);border-left:4px solid var(--acc1);padding:10px 14px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s ease-out;font-weight:600;width:100%}
.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* Facilities */
.fac{display:flex;flex-direction:column;gap:10px}
.fac-ico{font-size:28px;width:52px;height:52px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.pips{display:flex;gap:4px}
.pips i{width:22px;height:8px;border-radius:3px;background:var(--panel3)}
.pips i.on{background:linear-gradient(90deg,var(--acc1),var(--gold))}

.chart{display:flex;align-items:center;gap:3px;height:140px;padding:6px 0;border-bottom:1px solid var(--line);position:relative}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:center;min-width:4px}
.chart .col i{display:block;border-radius:2px}
.chart .zero{position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}

input[type=range]{width:100%;accent-color:var(--acc1)}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer}
.toggle .sw{width:46px;height:26px;border-radius:99px;background:var(--panel3);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on .sw{background:var(--acc1)}
.toggle.on .sw::after{left:22px}

/* Mentor */
.talk-bg{position:fixed;inset:0;z-index:85;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.7));display:flex;align-items:flex-end;justify-content:center;padding:16px;cursor:pointer}
.talk{position:relative;width:100%;max-width:780px;display:flex;gap:16px;align-items:flex-end;background:linear-gradient(180deg,#18223a,#0f1626);border:1px solid #3a4a6b;border-top:3px solid var(--gold);border-radius:16px;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:tin .25s ease-out}
.talk .portrait{flex:none;width:132px;height:132px;margin-top:-56px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.6);overflow:hidden;background:#121a2a}
.talk-body{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column}
.talk-name{font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);font-size:15px}
.talk-role{font-size:11px;color:var(--muted);margin-bottom:8px}
.talk-text{font-size:16px;line-height:1.55;min-height:75px;flex:1}
.talk-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
.talk-next{font-size:12px;color:var(--muted);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.buck .m-open{opacity:0}
.talking .buck .m-open{animation:mo .24s steps(1) infinite}
.talking .buck .m-closed{animation:mc .24s steps(1) infinite}
@keyframes mo{0%{opacity:1}50%{opacity:0}}
@keyframes mc{0%{opacity:0}50%{opacity:1}}
.buck .eyes{animation:blink 5s infinite;transform-origin:60px 51px}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
.buck-card{display:flex;gap:14px;align-items:center;margin-bottom:14px;border-left:3px solid var(--gold)}
.buck-card .portrait{flex:none;width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);overflow:hidden}

@media (max-width:560px){

@media (max-width:860px){

  .nav{position:sticky;top:57px;z-index:15;height:auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:6px 10px;background:rgba(10,14,21,.95)}
  .nav button.on{box-shadow:inset 0 -3px 0 var(--acc1)}
  .main{padding:16px}
  .tb-stats .hide-m{display:none}

}

  .tb-team .nm{max-width:120px}

  .tb-stats b{font-size:13px}
  .opts.c3,.opts.c4{grid-template-columns:repeat(2,1fr)}
  .sb-abbr{font-size:16px}.sb-score{font-size:28px;min-width:40px}.sb-clock{font-size:20px}.sb-team{padding:8px;gap:6px}.sb-mid{padding:4px 8px}
  .sb-team .badge{display:none}
  .field{height:110px}
  .hero .tname{font-size:22px}
  .grid{grid-template-columns:1fr}
}

/* ================= MAKEOVER LAYER ================= */
.field3d{position:relative;border-radius:12px;padding:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#1c2a44,#06090f 70%);border:1px solid #26314a;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.field3d canvas{display:block;width:100%}
.field3d.tilt{perspective:1100px;padding:0 18px 8px}
.field3d.tilt canvas{margin-top:-4.5%}
.field3d.tilt canvas{transform:rotateX(26deg);transform-origin:50% 100%;border-radius:6px;box-shadow:0 25px 30px -10px rgba(0,0,0,.6)}
.lastplay.snap{color:var(--muted);font-style:italic;border-style:dashed}

:root{--disp:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Bahnschrift","Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;--bg:#080c13;--panel:#121a28;--panel2:#19223a;--panel3:#212c45;--line:#243049}
body{background-image:radial-gradient(1100px 520px at 0% -10%,rgba(59,130,246,.10),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(245,158,11,.07),transparent 60%),linear-gradient(180deg,#080c13,#0a0f18)}
.h,.tname,.brand,.logo-big span,.logo-big b,.sb-abbr,.sb-score,.sb-clock,.kpi b,.rating-box b,.final-banner,.talk-name,.dd b,.dd-down,.cashbox b{font-family:var(--disp)}
.h{font-style:normal;letter-spacing:.05em}
h1.h{font-size:32px;line-height:1.05}
.tname{font-style:normal;letter-spacing:.02em}
.ico{flex:none;display:inline-block;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn .ico{opacity:.95}
.opt b{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px}
kbd{font-family:Consolas,"Courier New",monospace;font-size:10px;line-height:1;padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-bottom-width:2px;color:inherit;opacity:.75;font-weight:700}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-width:0}
.ch .h{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-ico{flex:none;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(245,158,11,.12);color:var(--acc1);border:1px solid rgba(245,158,11,.22)}
.ch-right{margin-left:auto;flex:none}
.ph-ico{flex:none;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--tc1),#1b2438);border:1px solid rgba(255,255,255,.12);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.page-head{margin-bottom:18px}
.card{border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.2)}
.kpi{border-radius:12px;background:linear-gradient(180deg,var(--panel2),#151d30)}
.kpi label{display:flex;align-items:center;gap:5px}
.tbl tr:hover td{background:rgba(255,255,255,.03)}
.res{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-weight:900;font-size:12px;margin-right:4px}
.res.W{background:rgba(34,197,94,.18);color:var(--good)}.res.L{background:rgba(244,63,94,.18);color:var(--bad)}.res.T{background:var(--panel3)}
.ha{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px}
.ha.h{background:rgba(59,130,246,.18);color:#93c5fd}.ha.a{background:var(--panel3);color:var(--muted)}
.logo-big .ico{color:var(--acc1);margin-bottom:6px}
/* topbar */
.topbar{height:60px;padding:0 18px}
.brand{display:flex;align-items:center;gap:6px;font-style:normal;font-size:21px;letter-spacing:.05em}
.brand .ico{color:var(--acc1)}
.brand span{margin:0;letter-spacing:.12em}
.brand .b1{color:var(--text);letter-spacing:.05em}
.tb-team .rec{color:var(--text)}
.tb-stats{gap:0}
.tb-stats .tbk{display:flex;flex-direction:row;align-items:center;gap:9px;padding:4px 14px;border-left:1px solid var(--line)}
.tbk>.ico{color:var(--dim)}
.tb-stats .tbk>div{display:flex;flex-direction:column;align-items:flex-start}
.tb-stats b{font-family:var(--disp);font-size:17px}
.icon-btn{display:flex;align-items:center;justify-content:center;color:var(--text);transition:border-color .15s,color .15s}
.icon-btn:hover{border-color:var(--acc1);color:var(--acc1)}
/* nav */
.layout{min-height:calc(100vh - 60px)}
.nav{top:60px;height:calc(100vh - 60px);background:linear-gradient(180deg,rgba(15,21,34,.7),rgba(8,12,19,.3));padding:10px 10px 50px}
.nav-group{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding:14px 12px 6px}
.nav-group:first-child{padding-top:4px}
.nav button{gap:11px;text-transform:none;font-size:14px;letter-spacing:0;font-weight:600;padding:9px 12px}
.nav button .ico{color:var(--dim);transition:color .15s}
.nav button:hover .ico{color:var(--text)}
.nav button.on{background:linear-gradient(90deg,rgba(245,158,11,.16),rgba(245,158,11,.02));color:#fff;box-shadow:inset 3px 0 0 var(--acc1)}
.nav button.on .ico{color:var(--acc1)}
.nb{margin-left:auto;font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;line-height:16px}
.nb.bad{background:var(--bad);color:#fff}.nb.live{background:var(--acc1);color:#111;animation:pulse 1.2s infinite}
.nb.dot{width:8px;height:8px;padding:0;background:var(--acc1);box-shadow:0 0 8px var(--acc1)}
.nav-foot{margin-top:auto;padding:16px 12px 4px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:8px}
/* score ticker */
.ticker{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:18;display:flex;background:#04060a;border-top:1px solid #26314a;font-size:12px;box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.tk-label{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;background:linear-gradient(90deg,var(--acc2),var(--acc1));color:#1a1204;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-family:var(--disp);font-size:13px}
.tk-track{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tk-move{display:inline-flex;white-space:nowrap;height:100%;align-items:center;animation:tick linear infinite}
.tk-move:hover{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tk{display:inline-flex;align-items:center;gap:6px;padding:0 18px;height:100%;border-right:1px solid #182033}
.tk b{font-family:var(--disp);font-size:14px;letter-spacing:.03em}
.tk b.l{color:var(--muted);font-weight:400}
.tk i{font-style:normal;color:var(--gold);font-size:10px;font-weight:800}
.tk.me{background:rgba(245,158,11,.1)}
.main{padding-bottom:64px}
/* hero */
.hero{padding:24px;border-radius:18px;background:linear-gradient(110deg,var(--tc1),rgba(18,26,40,.92) 58%),radial-gradient(600px 200px at 100% 0%,rgba(255,255,255,.06),transparent),var(--panel)}
.hero .tname{font-size:38px;line-height:1}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hchip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600}
.rating-box{border-radius:12px;min-width:76px}
.rating-box label{display:flex;align-items:center;justify-content:center;gap:4px}
.rating-box b{font-size:28px}
.matchup .tname{font-size:20px}
.score div span.row{display:inline-flex}
/* tables & roster */
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--text)}
.tbl th.sorted{color:var(--acc1)}
.plink{cursor:pointer;background:none;border:none;padding:0;font-weight:700;color:var(--text);text-align:left;font-size:inherit}
.plink:hover{color:var(--acc1);text-decoration:underline}
.chip .cnt{opacity:.55;font-weight:600}
.chip.short{border-color:rgba(244,63,94,.65)}
.chip.short .cnt{color:var(--bad);opacity:1}
.tag{display:inline-flex;align-items:center;gap:3px}
/* player card */
.pcard-top{display:flex;gap:16px;align-items:center;padding:16px;border-radius:14px;background:linear-gradient(120deg,var(--tc1),rgba(20,27,40,.95) 70%);margin-bottom:14px}
.ovr-ring{width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid;background:rgba(0,0,0,.4);flex:none}
.ovr-ring b{font-family:var(--disp);font-size:30px;line-height:1}
.ovr-ring span{font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.statgrid div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.statgrid label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.statgrid b{font-family:var(--disp);font-size:20px}
/* live game */
.call{position:relative;padding-right:34px}
.call kbd{position:absolute;top:9px;right:9px}
.call b{display:flex;align-items:center;gap:6px}
/* misc */
.toast{display:flex;align-items:center;gap:10px}
.toast .ico{color:var(--acc1)}.toast.good .ico{color:var(--good)}.toast.bad .ico{color:var(--bad)}
.modal{border-radius:18px}
.modal .ch{margin-bottom:16px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setting:last-of-type{border-bottom:none}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{justify-content:flex-start;padding:11px 14px}
.fac-ico{color:var(--acc1);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25)}
.buck-card .btn{flex:none}
@media (max-width:860px){
  .topbar{height:56px}
  .layout{min-height:calc(100vh - 56px)}
  .nav{top:56px;height:auto;padding:6px 10px;box-shadow:none}
  .nav-group,.nav-foot{display:none}
  .nav button{font-size:13px;padding:8px 10px;gap:7px}
  .nav button.on{box-shadow:inset 0 -3px 0 var(--acc1)}
  .ticker{display:none}
  .main{padding-bottom:24px}
  .hero .tname{font-size:30px}
  .tb-stats .tbk.hide-m{display:none}
}
@media (max-width:560px){
  .topbar .brand{display:none}
  .buck-card .btn{width:100%}
  .topbar{gap:8px;padding:0 10px}
  .tb-team .xs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-stats .tbk{padding:0 0 0 8px;border:none}
  .tbk>.ico{display:none}
  .hero{padding:18px}
  .call{padding-right:10px}.call kbd{display:none}
  kbd{display:none}
}

/* ================= EDITORIAL THEME ================= */
:root{--bg:#0e1013;--bg2:#13161a;--panel:#16191d;--panel2:#1c2025;--panel3:#252a30;--line:#2a2f36;--text:#e7e5e1;--muted:#9b9a95;--dim:#6c6e71;--good:#4fb36b;--bad:#e05a4f;--gold:#d2a63a;--acc1:#e7e5e1;--acc2:#cfccc6}
body{background:var(--bg);background-image:none}
.h{font-style:normal;letter-spacing:.02em}
h1.h{font-size:30px;letter-spacing:.01em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:none;padding:16px 18px}
.grid,.grid2{gap:12px}
/* section headers: plain label with a rule */
.ch{margin:-2px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.ch .h{font-size:13px;letter-spacing:.09em;color:var(--muted);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-weight:700}
h2.h{font-size:16px}
h3.h{font-size:11px;letter-spacing:.09em;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-weight:700}
.page-head{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;position:relative}
.page-head::after{content:"";position:absolute;left:0;bottom:-1px;width:56px;height:3px;background:var(--tc1)}
.page-head .muted.sm{margin-top:4px}
/* buttons and chips */
.btn{border-radius:4px;background:var(--panel2);border-color:var(--line);font-weight:600;padding:7px 13px}
.btn:hover:not(:disabled){background:var(--panel3);border-color:#3a4049}
.btn.primary{background:var(--text);border-color:var(--text);color:#111}
.btn.primary:hover:not(:disabled){background:#fff;border-color:#fff}
.btn.big{padding:11px 20px;font-size:15px;border-radius:5px}
.btn.green{background:transparent;border-color:#3c6e4a;color:#8fd3a2}
.btn.danger{background:transparent;border-color:#6e3a36;color:#f0a39b}
.btn kbd,.call kbd,.buck-card kbd{display:none}
.chip{border-radius:3px;padding:5px 10px;background:transparent;border-color:var(--line);color:var(--muted);font-weight:600}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:#111;border-color:var(--text)}
.opt{border-radius:5px;border-width:1px}
.opt.on{border-color:var(--text);background:var(--panel2)}
.toggle.on .sw{background:var(--good)}
.icon-btn{border-radius:4px;background:transparent}
.icon-btn:hover{border-color:var(--text);color:var(--text)}
/* top bar and sidebar */
.topbar{background:#0b0c0e;backdrop-filter:none}
.topbar::after{display:none}
.brand{font-size:19px;letter-spacing:.04em}
.brand span{color:var(--muted);letter-spacing:.04em}
.brand .b1{color:var(--text)}
.tb-stats .tbk{border-left-color:var(--line)}
.tb-stats b.gold{color:var(--text)}
.nav{background:#111316}
.nav button{border-radius:3px}
.nav button.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--text)}
.nav button.on .ico{color:var(--text)}
.nb.dot{box-shadow:none;background:var(--muted)}
.nb.live{animation:none;background:var(--bad);color:#fff}
/* hero */
.hero{border-radius:6px;border:none;background:var(--tc1);background-image:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,.55));padding:22px 24px}
.hero::after{display:none}
.hero .muted{color:rgba(255,255,255,.75)}
.hero .tname{font-size:40px}
.hero-chips{gap:0;margin-top:8px}
.hchip{background:none;border:none;border-radius:0;padding:0 12px 0 0;margin-right:12px;border-right:1px solid rgba(255,255,255,.3);font-weight:600;color:rgba(255,255,255,.92)}
.hchip:last-child{border-right:none}
.hchip .ico{display:none}
.hchip.good,.hchip.bad{color:#fff}
.rating-box{background:rgba(0,0,0,.28);border:none;border-radius:4px}
.rating-box label .ico{display:none}
.rating-box label{color:rgba(255,255,255,.7)}
/* stat blocks instead of tiles */
.kpis{gap:0;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.kpi{background:none;border:none;border-left:1px solid var(--line);border-radius:0;padding:2px 14px 8px}
.kpi label .ico{display:none}
.kpi label{font-size:10.5px;letter-spacing:.08em}
.kpi b{font-size:22px}
.page-head .kpi{border-left:none}
.bar{height:6px;border-radius:2px}
.bar>i{background:var(--text);border-radius:2px}
/* tables */
.tbl th{background:var(--panel2);color:var(--muted);border-bottom:1px solid var(--line);padding:7px 8px}
.tbl td{border-bottom:1px solid #20242a}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.012)}
.tbl tr.me td{background:rgba(255,255,255,.055)}
.tbl th.sorted{color:var(--text)}
.pos{border-radius:2px;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:10.5px}
.ovr{border-radius:3px;font-size:12.5px;min-width:30px}
.o90{background:#c9a227;color:#16120a}.o80{background:#2f7d45;color:#fff}.o70{background:#2a5d96;color:#fff}.o60{background:#474d55;color:#fff}.o0{background:#30353b;color:#c4c4c0}
.tag{background:none!important;padding:0;margin-left:8px;font-size:10px;letter-spacing:.05em}
.tag.st{color:var(--gold)}.tag.inj{color:var(--bad)}.tag.rk{color:#7fb0e6}.tag.exp{color:var(--muted)}
.res{border-radius:2px}
.ha{border-radius:2px;background:none!important;padding:0}
.ha.h{color:var(--text)}.ha.a{color:var(--dim)}
/* lists and misc */
.news div{border-left-width:2px;background:none;border-radius:0;padding:6px 8px}
.news div.gold{border-color:var(--gold)}
.score{border-radius:3px;background:var(--panel2)}
.ticker{background:#0b0c0e;border-top-color:var(--line);box-shadow:none}
.tk-label{background:var(--text);color:#111}
.tk.me{background:rgba(255,255,255,.06)}
.fac-ico{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:4px}
.pips i{border-radius:1px;height:6px}
.pips i.on{background:var(--text)}
.buck-card{border-left:1px solid var(--line);padding:12px 16px}
.buck-card .portrait{border:1px solid var(--line);width:56px;height:56px}
.buck-card .talk-name{color:var(--muted);font-style:normal;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:11px!important;letter-spacing:.09em}
.buck-card q{font-style:normal;quotes:none}
.toast{border-radius:4px;border-left-width:3px;background:#17191c}
.toast .ico{color:var(--text)}
.modal{border-radius:6px;background:var(--panel)}
.modal-bg{background:rgba(0,0,0,.7)}
.pcard-top{border-radius:4px;background:var(--tc1);background-image:linear-gradient(90deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.statgrid div{border-radius:3px;background:var(--panel2)}
.cashbox{border-radius:4px}
.cashbox b{color:var(--text)}
.tcard{border-radius:6px}
.tcard-band{opacity:.9;height:6px;background:linear-gradient(90deg,var(--c1) 70%,var(--c2) 70%)}
.tcard-stats div{border-radius:3px}
.team-grid .tcard .btn.primary{background:var(--text)}
/* title screen */
.title-wrap{background:var(--bg)}
.title-card{border-radius:6px;box-shadow:none;background:var(--panel)}
.logo-big span{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--text);font-style:normal}
.logo-big b{color:var(--muted);font-style:normal;letter-spacing:.3em}
/* live game */
.overlay{background:rgba(10,11,13,.97)}
.scorebug{border-radius:4px;box-shadow:none}

/* setup screen */
.setup{min-height:100vh;background-color:#1a6230;background-image:linear-gradient(rgba(8,10,12,.32),rgba(8,10,12,.62)),repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 2px,transparent 2px 160px),repeating-linear-gradient(90deg,#1e6c34 0 80px,#1a6230 80px 160px);background-size:auto,160px 100%,160px 100%;animation:turf 30s linear infinite}
@keyframes turf{to{background-position:0 0,160px 0,160px 0}}
@media (prefers-reduced-motion:reduce){.setup{animation:none}}
.setup-wrap{max-width:1040px;margin:0 auto;padding:40px 20px;min-height:100vh;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.1fr);gap:40px;align-items:center}
.setup .logo-big{align-items:flex-start;margin:0}
.setup .logo-big span{font-size:72px;line-height:.9;letter-spacing:.01em}

.buck-say{display:flex;align-items:flex-end;gap:14px}
.buck-say .portrait{flex:none;width:96px;height:96px;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#121a2a}
.bubble{position:relative;background:#f4f2ee;color:#16181b;border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.45;max-width:320px;margin-bottom:18px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;border:9px solid transparent;border-left:none;border-right-color:#f4f2ee}
.bubble b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b6b66;margin-bottom:3px}
.setup-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.continue{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.continue b{display:block;font-size:15px}
.or-line{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:18px 0 6px}
.or-line::before,.or-line::after{content:"";flex:1;height:1px;background:var(--line)}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:14px 0}
.step+.step{border-top:1px solid var(--line)}
.step-n{width:28px;height:28px;border-radius:50%;border:2px solid var(--text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-top:1px}
.step-body label{display:block;font-size:15px;font-weight:700;margin-bottom:10px}
.name-row{display:flex;gap:8px}
.inp.big{font-size:18px;padding:12px 14px;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.inp.big:focus{border-color:var(--text)}
.btn.dice{flex:none;width:50px;padding:0;border-radius:6px}

.btn.dice .ico{transition:transform .25s}
.choices{display:grid;gap:8px}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.choice:hover{transform:translateY(-2px);border-color:#4a5058}
.choice.on{border-color:var(--text);background:var(--panel3)}
.choice.on::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.choice .ch-top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-right:12px}
.choice b{font-size:15px}
.choice .cash{font-family:var(--disp);font-size:24px;font-weight:700;color:var(--good)}
.choice .blurb{font-size:12px;color:var(--muted);line-height:1.4}
.meter{display:flex;gap:3px}
.meter i{width:12px;height:7px;border-radius:7px/4px;background:var(--panel3);border:1px solid #3a4049}
.meter i.on{background:#c47a3c;border-color:#c47a3c}
.choice.style{flex-direction:row;align-items:flex-start;gap:12px}
.choice.style>span:last-child{display:flex;flex-direction:column;gap:3px}

/* ================= UTILITIES ================= */
const $ = (s, el = document) => el.querySelector(s);

const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// all money is stored in millions
function fmtM(v) {
  const neg = v < 0; v = Math.abs(v);
  const s = v >= 1000 ? '$' + (v / 1000).toFixed(2) + 'B' : v >= 10 ? '$' + v.toFixed(1) + 'M' : v >= 1 ? '$' + v.toFixed(2) + 'M' : v < 0.0005 ? '$0' : '$' + Math.round(v * 1000) + 'K';
  return (neg ? '-' : '') + s;
}

const fmtClock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = pct / 100; r = clamp(Math.round(r + (f < 0 ? r : 255 - r) * f), 0, 255); g = clamp(Math.round(g + (f < 0 ? g : 255 - g) * f), 0, 255); b = clamp(Math.round(b + (f < 0 ? b : 255 - b) * f), 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

/* ================= DATA ================= */

/* ---- Standings & playoffs ---- */
const cmpTeams = (a, b) => pct(b) - pct(a) || (b.pf - b.pa) - (a.pf - a.pa) || b.pf - a.pf;

function confSeeds(conf) {
  const winners = DIVS.map(d => divTeams(conf, d)[0]).sort(cmpTeams);
  const rest = G.teams.filter(t => t.conf === conf && !winners.includes(t)).sort(cmpTeams).slice(0, 3);
  return [...winners, ...rest].map(t => t.id);
}
function startPlayoffs() {
  G.phase = 'playoffs';
  G.po = { round: 1, seeds: { AC: confSeeds('AC'), NC: confSeeds('NC') }, games: [], results: [], champion: null };
  G.po.alive = { AC: G.po.seeds.AC.slice(), NC: G.po.seeds.NC.slice() };
  const inIt = [...G.po.seeds.AC, ...G.po.seeds.NC].includes(G.user);
  if (inIt) { const conf = userTeam().conf, seed = G.po.seeds[conf].indexOf(G.user) + 1; news(`PLAYOFFS! You clinched the #${seed} seed in the ${CONF[conf]}.`, 'gold'); mentorPlayoffs(seed); }
  else { news(`Your season is over. You missed the playoffs at ${recStr(userTeam())}.`, 'bad'); mentorMissed(); }
  makeRoundGames();
}
function makeRoundGames() {
  const P = G.po, games = [], mk = (h, a) => ({ h, a, hs: null, as: null, played: false });
  if (P.round <= 3) {
    for (const c of ['AC', 'NC']) {
      const s = P.alive[c];
      if (P.round === 1) games.push(mk(s[1], s[6]), mk(s[2], s[5]), mk(s[3], s[4]));
      else if (P.round === 2) games.push(mk(s[0], s[3]), mk(s[1], s[2]));
      else games.push(mk(s[0], s[1]));
    }
  } else {
    const a = team(P.alive.AC[0]), n = team(P.alive.NC[0]);
    games.push(cmpTeams(a, n) <= 0 ? mk(a.id, n.id) : mk(n.id, a.id));
  }

}
function advancePlayoffs() {
  const P = G.po;

    const win = gm.hs > gm.as ? gm.h : gm.a, lose = win === gm.h ? gm.a : gm.h;
    P.results.push({ round: P.round, h: gm.h, a: gm.a, hs: gm.hs, as: gm.as, ot: gm.ot });
    for (const c of ['AC', 'NC']) P.alive[c] = P.alive[c].filter(id => id !== lose);
    if (lose === G.user) { P.userResult = `Lost in ${ROUNDS[P.round - 1]}`; news(`Eliminated in the ${ROUNDS[P.round - 1]}. There's always next year.`, 'bad'); }
    if (win === G.user && P.round < 4) news(`Advancing! You won the ${ROUNDS[P.round - 1]}.`, 'gold');

}
function endSeason() {

  G.champions.unshift({ year: G.year, id: champ.id, name: `${champ.city} ${champ.name}` });
  champ.mood = clamp(champ.mood + 10, 0, 100);
  let result = P.userResult || 'Missed playoffs';
  if (P.champion === G.user) { mentorChamp(); result = 'GRAND BOWL CHAMPIONS'; addFin('bonus', 25); news(`You won the ${G.year} Grand Bowl. +$25M championship bonus.`, 'gold'); }
  else news(`The ${champ.city} ${champ.name} win the ${G.year} Grand Bowl.`, 'info');
  const playoffTeams = [...P.seeds.AC, ...P.seeds.NC];
  for (const t of G.teams) {
    let d = (t.w - 8.5) * 0.5 + (playoffTeams.includes(t.id) ? 2 : 0) + (t.id === champ.id ? 5 : 0) + gauss(0, 1);
    t.fanbase = clamp(Math.round(t.fanbase + d), 15, 100);
  }
  G.history.unshift({ year: G.year, rec: recStr(u), team: u.abbr, result, profit: seasonNet(), value: teamValue(u) });
  UI.seasonSummary = { year: G.year, rec: recStr(u), result, profit: seasonNet(), champ: `${champ.city} ${champ.name}`, won: P.champion === G.user };
  // aging / development / retirement
  const retired = [];
  for (const t of G.teams) {
    t.roster = t.roster.filter(p => {
      progress(p, t.training);
      if (shouldRetire(p)) { if (t.id === G.user) retired.push(p); return false; }
      return true;
    });
  }
  G.fa = G.fa.filter(p => { progress(p, 1); return !shouldRetire(p) && p.ovr >= 45; });
  if (retired.length) news(`Retired from your team: ${retired.map(p => `${p.pos} ${fullName(p)}`).join(', ')}.`, 'info');
  // contracts

  for (const t of G.teams) {
    if (t.id === G.user) continue;
    t.roster = t.roster.filter(p => {
      if (p.years > 0) return true;
      let ch = p.ovr >= 75 ? 0.8 : p.ovr >= 65 ? 0.55 : 0.3;

function progress(p, tl) {
  p.age++;
  let d;
  if (p.age <= 24) d = ri(0, 5) + (rnd() < (tl - 1) * 0.2 ? 1 : 0) + (tl >= 4 ? 1 : 0);
  else if (p.age <= 27) d = ri(-1, 3) + (rnd() < (tl - 1) * 0.15 ? 1 : 0);
  else if (p.age <= 30) d = ri(-2, 1);
  else if (p.age <= 32) d = ri(-4, 0);
  else d = ri(-7, -1);
  if (p.pos === 'K' && p.age <= 36) d = Math.max(d, -1);
  if (d > 0) d = Math.min(d, Math.max(0, p.pot - p.ovr) + (rnd() < 0.1 ? 2 : 0));
  p.ovr = clamp(p.ovr + d, 30, 99);

/* ---- Draft ---- */
function makeDraft() {
  const order = G.teams.slice().sort((a, b) => -cmpTeams(a, b)).map(t => t.id);
  const runnerUp = G.po.results.filter(r => r.round === 4).map(r => r.h === G.po.champion ? r.a : r.h)[0];
  for (const id of [runnerUp, G.po.champion]) { order.splice(order.indexOf(id), 1); order.push(id); }
  const full = []; for (let r = 0; r < 7; r++) full.push(...order);
  const posW = POS.map(p => ROSTER_GEN[p]), prospects = [];
  for (let i = 0; i < 260; i++) {
    const ovr = rnd() < 0.09 ? gauss(68, 5) : gauss(52, 7);
    const p = makePlayer(wpick(POS, posW), ovr, ri(21, 23), null);
    p.pot = clamp(p.ovr + ri(3, 26), p.ovr, 99);
    p.n1 = rnd() * 2 - 1; p.n2 = rnd() * 2 - 1; p.college = pick(COLLEGES); p.years = 4;
    prospects.push(p);
  }
  return { order: full, pick: 0, prospects, picks: [], done: false };
}
function scoutView(p) {
  const err = SCOUT_ERR[userTeam().scouting];
  const est = clamp(Math.round(p.ovr + p.n1 * err), 30, 99), estP = clamp(Math.round(p.pot + p.n2 * err), est, 99);
  return { est, estP, err, lo: Math.max(30, est - err), hi: Math.min(99, est + err) };
}
const rookieSalary = n => Math.max(0.75, Math.round(9 * Math.exp(-(n - 1) / 38) * 20) / 20);
function draftPlayer(tid, p) {

  D.prospects = D.prospects.filter(x => x !== p);
  p.salary = rookieSalary(no); p.years = 4; p.rookie = true;
  delete p.n1; delete p.n2;
  t.roster.push(p);
  D.picks.push({ no, round: Math.ceil(no / 32), team: tid, name: fullName(p), pos: p.pos, ovr: p.ovr, college: p.college });
  D.pick++;
  if (tid === G.user) news(`Drafted ${p.pos} ${fullName(p)} (${p.college}) with pick #${no}.`, 'good');
  if (D.pick >= D.order.length) finishDraft();
}
function aiPick(tid) {
  const t = team(tid), D = G.draft;
  const counts = {}; POS.forEach(p => counts[p] = t.roster.filter(x => x.pos === p).length);
  let best = null, bs = -1e9;
  for (const p of D.prospects) {
    let s = p.ovr * 0.7 + p.pot * 0.3 + Math.max(0, ROSTER_GEN[p.pos] - counts[p.pos]) * 3 + gauss(0, 3);

}
function finishDraft() {

  for (const p of D.prospects) { delete p.n1; delete p.n2; p.years = 0; p.salary = 0.75; G.fa.push(p); }
  D.prospects = [];
  news('The draft is complete. Undrafted rookies have joined the free agent pool.', 'info');
}

/* ---- Offseason transitions ---- */
function aiFreeAgency() {
  for (const t of shuffle(G.teams.filter(t => t.id !== G.user))) {
    for (const pos of POS) {
      let need = ROSTER_GEN[pos] - t.roster.filter(p => p.pos === pos).length;
      while (need-- > 0) {
        const c = G.fa.filter(p => p.pos === pos && payroll(t) + salaryFor(p) <= SALARY_CAP).sort((a, b) => b.ovr - a.ovr).slice(0, 3);
        let p = c.length ? pick(c) : null;
        if (p) G.fa = G.fa.filter(x => x !== p);
        else p = makePlayer(pos, ri(42, 54), ri(22, 30));
        p.salary = salaryFor(p); p.years = contractYears(p);
        t.roster.push(p);
      }
    }
    // trim to roster limit
    t.roster.sort((a, b) => a.ovr - b.ovr);
    while (t.roster.length > MAX_ROSTER - 2) {
      const i = t.roster.findIndex(p => t.roster.filter(x => x.pos === p.pos).length > STARTERS[p.pos] + 1);
      if (i < 0) break;
      const [p] = t.roster.splice(i, 1); p.years = 0; G.fa.push(p);
    }
  }
}

function userResults() {

function statCells(p) {
  const s = p.stats, c = (l, v) => `<div><label>${l}</label><b>${v}</b></div>`;
  switch (p.pos) {

    case 'RB': return c('Carries', s.ra) + c('Rush yds', s.ry) + c('Rush TD', s.rtd) + c('Rec yds', s.recy);

/* ================= ANIMATED FIELD ================= */
// Field coordinates are in yards: x 0..120 (end zones 0-10 and 110-120), y 0..53.3 sideline to sideline.
// The away team (index 1) always attacks to the right, the home team (index 0) to the left.
const MID = 26.65;
const OFF_ROLES = ['LT', 'LG', 'C', 'RG', 'RT', 'QB', 'RB', 'WR1', 'WR2', 'WR3', 'TE'];
const DEF_ROLES = ['DL1', 'DL2', 'DL3', 'DL4', 'LB1', 'LB2', 'LB3', 'CB1', 'CB2', 'S1', 'S2'];
const ANIM_MS = [2300, 1550, 850, 0], GAP_MS = [800, 500, 250, 60];
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
function formation(los, dir) {
  const fx = x => clamp(x, 0.6, 119.4), b = n => fx(los - dir * n), a = n => fx(los + dir * n);
  return {
    off: [[b(.9), MID - 2.8], [b(.9), MID - 1.4], [b(.9), MID], [b(.9), MID + 1.4], [b(.9), MID + 2.8], [b(4.5), MID], [b(6.5), MID + 1.6], [b(1), 5], [b(1), 48.3], [b(1.4), 13.5], [b(1), MID + 4.4]],
    def: [[a(1), MID - 4], [a(1), MID - 1.4], [a(1), MID + 1.4], [a(1), MID + 4], [a(5), MID - 7], [a(5), MID], [a(5), MID + 7], [a(6.5), 6], [a(6.5), 47.3], [a(13), MID - 9], [a(13), MID + 9]],
  };
}
function sampleTrack(tr, t) {
  let i = 0; while (i < tr.length - 2 && t > tr[i + 1][0]) i++;
  const p = tr[i], q = tr[Math.min(i + 1, tr.length - 1)];
  const u = q[0] > p[0] ? ease(clamp((t - p[0]) / (q[0] - p[0]), 0, 1)) : 1;
  return { x: lerp(p[1], q[1], u), y: lerp(p[2], q[2], u), h: lerp(p[3] || 0, q[3] || 0, u) };
}

// Turns a play result from the engine into keyframe tracks for all 22 players and the ball.
function buildPlay(fv, pl) {
  const o = pl.o, d = 1 - o, dir = o === 1 ? 1 : -1, X = b => fv.absX(o, b), los = X(pl.from);
  const cur = fv.P.map(a => a.map(p => [p.x, p.y]));
  const cl = (x, y) => [clamp(x, 0.5, 119.5), clamp(y, 0.8, 52.5)];
  const j = n => (rnd() * 2 - 1) * n;
  const O = r => OFF_ROLES.indexOf(r), DF = r => DEF_ROLES.indexOf(r);
  const tr = [[], []];
  const key = (k, i, ...pts) => { tr[k][i] = [[0, cur[k][i][0], cur[k][i][1]], ...pts]; };
  for (let k = 0; k < 2; k++) for (let i = 0; i < 11; i++) key(k, i, [1, cur[k][i][0], cur[k][i][1]]);
  const qbI = O('QB'), rbI = O('RB'), S = { tr, ball: null, flash: null, labels: [] };
  const flash = (text, color, at) => { S.flash = { text, color, at }; };
  const teamCol = k => fv.cols[k].c1;
  const pursue = (ex, ey, tEnd = 1) => {
    for (let i = 0; i < 11; i++) {
      const [cx, cy] = cur[d][i], near = i >= 4 && i <= 6 ? 1.5 : i >= 7 ? 3 : 4;
      key(d, i, [0.3, cx - dir * (i < 4 ? 0.3 : 1), lerp(cy, ey, 0.3)], [tEnd, ...cl(ex + dir * (0.6 + rnd() * near), ey + j(near + 1))]);
    }
  };
  const routes = (skip, tEnd) => {
    for (const r of ['WR1', 'WR2', 'WR3', 'TE']) {
      const i = O(r); if (i === skip) continue;
      const [cx, cy] = cur[o][i], depthYds = 7 + rnd() * 12, bend = (MID - cy) * (0.2 + rnd() * 0.4);
      key(o, i, [tEnd * 0.6, ...cl(cx + dir * depthYds * 0.75, cy)], [tEnd, ...cl(cx + dir * depthYds, cy + bend)], [1, ...cl(cx + dir * (depthYds + 2), cy + bend * 1.2)]);
    }
  };
  const passBlock = (qbSpot, tRush) => {
    for (let i = 0; i < 5; i++) { const [cx, cy] = cur[o][i]; key(o, i, [0.3, cx - dir * 1.3, cy], [1, cx - dir * 1.8, cy + j(.4)]); }
    for (let i = 0; i < 4; i++) { const [cx, cy] = cur[d][i]; key(d, i, [0.3, cx - dir * 1.4, cy], [tRush, ...cl(lerp(cx, qbSpot[0], 0.55), lerp(cy, qbSpot[1], 0.4))], [1, ...cl(lerp(cx, qbSpot[0], 0.7), lerp(cy, qbSpot[1], 0.55))]); }
  };
  // defenders mirror receivers with a short lag
  const cover = (pairs, exceptD) => {
    for (const [dr, or] of pairs) {
      const di = DF(dr); if (di === exceptD) continue;
      const rt = tr[o][O(or)];
      tr[d][di] = [[0, cur[d][di][0], cur[d][di][1]], ...rt.slice(1).map(p => [Math.min(1, p[0] + 0.06), ...cl(p[1] + dir * 1.6, p[2] + (MID - p[2]) * 0.06 + 0.8)])];
    }
  };
  const COVER = [['CB1', 'WR1'], ['CB2', 'WR2'], ['S1', 'WR3'], ['LB3', 'TE']];

  if (pl.kind === 'run') {
    const y0 = clamp(MID + j(5), 8, 45), endB = clamp(pl.from + pl.yards, 0, 100);
    const hp = [los - dir * 3.8, MID + 1], hole = [pl.yards > 0 ? los + dir * 0.8 : X(endB), y0];
    let E = cl(X(endB) + (pl.td ? dir * 3.5 : 0), y0 + j(6));
    if (pl.safety) E = cl(X(0) - dir * 1.5, y0);
    const tEnd = pl.fumble ? 0.82 : 1;
    key(o, rbI, [0.15, ...hp], [0.36, ...hole], [tEnd, ...E], [1, ...E]);
    key(o, qbI, [0.12, los - dir * 4.2, MID], [0.55, los - dir * 6, MID - 2.5], [1, los - dir * 6.5, MID - 3]);
    for (let i = 0; i < 5; i++) { const [cx, cy] = cur[o][i]; key(o, i, [0.3, cx + dir * 1, cy], [1, cx + dir * (pl.yards > 0 ? 2.4 : 0.3), cy + j(1)]); }
    for (const r of ['WR1', 'WR2', 'WR3', 'TE']) { const i = O(r), [cx, cy] = cur[o][i]; key(o, i, [0.55, ...cl(cx + dir * (5 + rnd() * 4), cy + j(2))], [1, ...cl(lerp(cx + dir * 8, E[0], 0.35), lerp(cy, E[1], 0.3))]); }
    pursue(E[0], E[1], tEnd);
    S.ball = [[0, los, MID, 0.5], [0.06, los - dir * 4.2, MID, 1], [0.15, ...hp, 1], [0.36, ...hole, 1], [tEnd, ...E, 1]];
    if (pl.fumble) { S.ball.push([1, ...cl(E[0] + dir * 2, E[1] + j(3)), 0]); flash('FUMBLE!', '#f43f5e', 0.84); }
    S.labels = [[0, 0.15, o, qbI, pl.qb], [0.15, 1, o, rbI, pl.carrier]];
    if (pl.td) flash('TOUCHDOWN!', teamCol(o), 0.98);
    if (pl.safety) flash('SAFETY!', teamCol(d), 0.98);
  } else if (pl.kind === 'pass' || pl.kind === 'inc' || pl.kind === 'int') {
    const deep = pl.deep, tT = deep ? 0.3 : 0.27, tC = deep ? 0.74 : 0.52;
    const qbDrop = [los - dir * (deep ? 7.5 : 6.2), MID + j(1)];
    key(o, qbI, [0.08, los - dir * 4.5, MID], [tT, ...qbDrop], [1, qbDrop[0] + dir * 0.6, qbDrop[1] + j(1)]);
    const ti = O(pl.role || 'WR1'), [sx, sy] = cur[o][ti];
    const laneY = ti === rbI || ti === O('TE') ? MID + j(7) : sy + (MID - sy) * (deep ? 0.25 : 0.45) + j(3);
    const C = cl(X(clamp(pl.from + pl.air, 0, 109)), laneY);
    const endB = clamp(pl.from + (pl.yards || 0), 0, 100);
    const E = pl.kind === 'pass' ? cl(X(endB) + (pl.td ? dir * 3 : 0), C[1] + j(4)) : C;
    routes(ti, tC);
    if (ti !== rbI) key(o, rbI, [0.3, los - dir * 4, MID + 2.5], [1, los - dir * 4.2, MID + 2.8]);
    passBlock(qbDrop, tT + 0.15);
    if (pl.kind === 'inc') key(o, ti, [tC, ...C], [1, ...cl(C[0] + dir * 2, C[1])]);
    else key(o, ti, [tC, ...C], [1, ...E]);
    for (const di of [DF('LB1'), DF('LB2')]) { const [cx, cy] = cur[d][di]; key(d, di, [0.4, cx + dir * 3, cy], [1, ...cl(lerp(cx + dir * 3, E[0], 0.5), lerp(cy, E[1], 0.5))]); }
    key(d, DF('S2'), [tC, ...cl(lerp(cur[d][DF('S2')][0], C[0] + dir * 3, 0.7), lerp(cur[d][DF('S2')][1], C[1], 0.6))], [1, ...cl(E[0] + dir * 2.5, E[1] + j(3))]);
    const covI = DF((COVER.find(c => c[1] === OFF_ROLES[ti]) || ['S1'])[0]);
    cover(COVER, covI);
    const mid = [(qbDrop[0] + C[0]) / 2, (qbDrop[1] + C[1]) / 2];
    const arc = deep ? 11 : 3.5;

function boxData(g) {

  return { teams: [g.t[0].id, g.t[1].id], score: g.score.slice(), qs: g.qs.map(q => q.slice()), ot: g.q >= 5, ts: g.ts.map(t => ({ ...t })), lines };

function boxHtml(b) {

    const parts = []; if (sk) parts.push(`${sk.name} ${sk.sk} sack${sk.sk > 1 ? 's' : ''}`); if (it) parts.push(`${it.name} ${it.dint} INT`);
    return parts.join(' · ') || '<span class="dim">—</span>';
  };
  return `<div class="tbl-wrap mt"><table class="tbl"><tr><th>Team</th>${['1', '2', '3', '4', 'OT'].slice(0, cols).map(q => `<th class="c">${q}</th>`).join('')}<th class="c">T</th></tr>${qrow(1, A)}${qrow(0, H)}</table></div>
  <div class="grid mt" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <div><table class="tbl"><tr><th></th><th class="c">${A.abbr}</th><th class="c">${H.abbr}</th></tr>${ts('yds', 'Total yards')}${ts('pass', 'Passing')}${ts('rush', 'Rushing')}${ts('first', 'First downs')}${ts('to', 'Turnovers')}</table></div>
    <div style="display:flex;flex-direction:column;gap:10px"><div><b class="sm">${A.abbr} leaders</b>${leaders(1)}</div><div><b class="sm">${H.abbr} leaders</b>${leaders(0)}</div></div>
  </div>`;
}

/* ---- dialog box ---- */
const Talk = { active: false, lines: [], i: 0, pos: 0, timer: null };
// queue a conversation; a `key` makes it a one-time story beat (remembered in the save)
function mentor(key, lines) {
  if (key) { if (!setting('buck')) return; G.mentorSeen = G.mentorSeen || {}; if (G.mentorSeen[key]) return; G.mentorSeen[key] = 1; }
  (UI.talkQ = UI.talkQ || []).push(lines.filter(Boolean));
}
function flushTalk() { if (Talk.active || !UI.talkQ || !UI.talkQ.length || $('#modal-root').innerHTML) return; startTalk(UI.talkQ.shift()); }
function startTalk(lines) { Talk.active = true; Talk.lines = lines; Talk.i = 0; renderTalk(); typeLine(); }
function renderTalk() {
  $('#talk-root').innerHTML = `<div class="talk-bg" onclick="talkNext()"><div class="talk" id="talkBox">
    <div class="portrait">${buckFace()}</div>
    <div class="talk-body"><div class="talk-name">${esc(BUCK.name)}</div><div class="talk-role">${BUCK.role}</div>
      <div class="talk-text" id="talkText"></div>
      <div class="talk-foot"><button class="btn sm" onclick="event.stopPropagation();closeTalk()">${icon('skip', 12)} Skip <kbd>Esc</kbd></button><span class="talk-next" id="talkNext"></span></div></div>
  </div></div>`;
}
function typeLine() {
  Talk.pos = 0; clearInterval(Talk.timer);
  Talk.timer = setInterval(() => { Talk.pos += ({ normal: 2, fast: 5, instant: 9999 })[setting('textSpeed')] || 2; if (Talk.pos >= Talk.lines[Talk.i].length) { clearInterval(Talk.timer); Talk.timer = null; } updateTalk(); }, 24);
  updateTalk();
}
function updateTalk() {
  const el = $('#talkText'), box = $('#talkBox'); if (!el) return;
  el.textContent = Talk.lines[Talk.i].slice(0, Talk.pos);
  box.classList.toggle('talking', !!Talk.timer);
  $('#talkNext').textContent = Talk.timer ? '' : Talk.i < Talk.lines.length - 1 ? 'Click or press Space ▶' : 'Click or press Space to close';
}
function talkNext() {
  if (!Talk.active) return;
  if (Talk.timer) { clearInterval(Talk.timer); Talk.timer = null; Talk.pos = Talk.lines[Talk.i].length; updateTalk(); return; }
  if (++Talk.i >= Talk.lines.length) closeTalk(); else typeLine();
}
function closeTalk() { clearInterval(Talk.timer); Talk.timer = null; Talk.active = false; $('#talk-root').innerHTML = ''; if (G) save(); flushTalk(); }

/* ---- story beats ---- */
function introLines() {
  const flavor = { easy: "It's a healthy chunk of change. Don't spend it all in one place.", normal: "It's a fair stake. Enough to get a seat at the table, if you're smart about it.", hard: "It ain't a fortune. I had a rough year at the racetrack. You'll have to start small and scrap your way up." }[G.diff];
  return [
    `Well, well. You must be ${G.owner}. Come in, sit down, mind the dog. Name's Walter Harrington, but everybody calls me Buck.`,
    "Forty-two years I've been buying and selling ball clubs. Baseball, hockey, a lacrosse team once. Don't ask about the lacrosse team.",
    "But football... football was always my first love. And these old knees, plus a doctor who won't stop nagging, tell me it's time to hang it up.",
    `No kids, no heirs, and too much money to take with me. So here's the deal: I'm staking you ${fmtM(G.cash)}. ${flavor}`,
    "Use it to buy yourself a football team. Cheap one, pricey one, that's your call. Just keep some cash in the bank to actually run the thing.",
    "Win games, fill seats, sell jerseys. Do that and the franchise grows in value, and so does your bank account.",
    "I'll keep my phone on. Call it a retirement hobby. Now go pick a team, kid.",
  ];
}
function boughtLines(t) {
  const u = units(t);
  return [
    `The ${t.city} ${t.name}! ${t.market >= 4 ? "Big market. The whole city is watching, so don't embarrass me." : t.market <= 1 ? "Small market, but loyal fans. You'll have to squeeze every dollar." : 'Good town. Good fans. Solid pick.'}`,
    u.ovr >= 72 ? 'And a talented roster, too. Expectations are high, so anything short of the playoffs and the fans will howl.' : u.ovr <= 65 ? "Roster's thin, though. This is a rebuild. Be patient, draft well, and don't overpay for washed-up veterans." : "Roster's middle of the pack. A few smart moves could put you in the playoff hunt.",
    G.coachMode ? "Every week you play a game. You wanted to call the plays yourself, so the headset's yours. Or quick-sim it if you're busy." : 'Every week you play a game. Your coordinators follow your Game Plan, and you can watch or just quick-sim it.',
    'Money comes in from tickets, merch, sponsors and TV. Payroll and upkeep go out. Happy fans spend more, and nothing makes fans happier than winning.',
    'In the offseason you re-sign your keepers, draft some college kids, and pick up free agents. Upgrade the facilities when you can afford it.',
    G.cash < 60 ? `One more thing. You've only got ${fmtM(G.cash)} left in the bank. That's thin. Watch your spending, or you'll be paying interest to the bank.` : `You've got ${fmtM(G.cash)} in the bank to work with. Spend it wisely.`,
    "Cash plus what the team is worth: that's your net worth. Grow it. Make an old man proud. And if you ever need me, just give me a call.",
  ];
}
function mentorAfterWeek(res) {
  if (!res) return;
  const t = userTeam();
  if (res === 'W') mentor('firstWin', [pick(["HA! That's a win! I just about knocked my iced tea off the porch rail.", "Now THAT is how you open an account. First win in the books, kid!"]), "Wins bring happy fans, and happy fans bring money. Keep stacking 'em."]);
  if (res === 'L') mentor('firstLoss', ["Tough one. Don't sweat it. I lost my first three games as an owner and nearly sold the team out of spite.", 'Check the Game Plan before next week. Sometimes the matchup tells you exactly where to attack.']);
  const results = [];
  for (const wk of G.schedule) {
    const g = wk.find(x => (x.h === G.user || x.a === G.user) && x.played); if (!g) continue;
    const home = g.h === G.user, my = home ? g.hs : g.as, th = home ? g.as : g.hs;
    results.push(my > th ? 'W' : my < th ? 'L' : 'T');
  }
  let streak = 0; for (let i = results.length - 1; i >= 0 && results[i] === res; i--) streak++;
  if (G.phase === 'regular' && res === 'L' && streak >= 3) mentor('cold' + G.year, [pick(["Three straight losses. My phone's ringing and it's not fans calling to say hi.", 'That is a skid, kid. The locals are getting restless.']), pick(['Look at your roster. Find the weak spot. Is it the quarterback? The line? Go get help in free agency.', 'Sometimes you shake it up. Try a different Game Plan, or train up the guys who are underperforming.'])]);
  if (G.phase === 'regular' && res === 'W' && streak >= 4) mentor('hot' + G.year, [pick(['Four in a row! This town is buzzing. I can hear it from here.', "You're on a heater, kid! Ride it."]), "Winning streaks are when fans buy jerseys. Maybe nudge those ticket prices up a hair while they're happy."]);
  if (G.cash < 0) mentor('debt' + G.year, ["Kid, I just looked at your books. You're in the red. The bank charges interest every single week you stay there.", 'Trim payroll, cool it on the upgrades, and make sure your ticket prices make sense. Get back in the black.']);
  const nw = G.cash + teamValue(t);
  if (nw >= 2000) mentor('nw2b', ["Two billion in net worth. You know how long it took me to get there? Don't answer that. It'll make me feel old.", 'Proud of you, kid. Real proud.']);
  if (nw >= 5000) mentor('nw5b', ["FIVE billion. You've outdone me. I'm putting your picture up next to mine in the den."]);
}
function mentorInjury(p, w) {
  mentor('injury', [`Bad news, kid. ${fullName(p)} is going to miss ${w} games. That's one of your best players.`, 'Injured players sit automatically and the next man up starts. If the backup is weak, sign a free agent. And a better Medical Center means fewer of these phone calls.']);
}
function mentorPlayoffs(seed) {
  const first = !(G.mentorSeen && G.mentorSeen.firstPO);
  mentor('po' + G.year, [`The playoffs! The #${seed} seed! ${first ? 'First trip to the dance. Savor it, kid.' : 'Getting to be a habit, huh?'}`, seed === 1 ? 'And the top seed means a week off while everybody else beats each other up.' : 'Four wins from the Grand Bowl. One game at a time.', 'Playoff home games sell tickets at a premium, so every round you survive pays.']);
  G.mentorSeen.firstPO = 1;
}
function mentorMissed() {
  mentor('miss' + G.year, [pick(['No playoffs this year. Hurts, I know.', 'Missed the cut. The fans will remember, but they forgive fast if you win next year.']), 'Silver lining: a worse record means a better draft pick. Use it.']);
}
function mentorChamp() {
  const before = G.champions.filter(c => c.id === G.user).length;
  mentor('champ' + G.year, ["YOU DID IT! GRAND BOWL CHAMPIONS! I'm hugging my dog and he is NOT happy about it!", before ? 'Another ring. Now we are talking dynasty.' : 'Forty-two years in this business and I never won one of these. You did it with my money, so I am counting it.', 'Your team just got a whole lot more valuable. Enjoy the parade, then get back to work. Everybody will be gunning for you next year.']);
}
function mentorOffseason() {
  mentor('offseason', ['Welcome to the offseason. This is where good owners become great ones.', 'First up, contracts. Some of your players are free agents now. Re-sign the ones worth keeping before somebody else grabs them.', 'Remember: players get older every year. Young guys improve, and anybody past 30 starts slipping.']);
}
function mentorDraft() {
  mentor('draft', ['Draft day! My favorite day of the year. Better than Christmas.', `Those ratings are estimates. Your scouts are only accurate to about ±${SCOUT_ERR[userTeam().scouting]} points. A kid listed at 70 might really be a 60, or an 80.`, 'Potential matters. A kid with an A grade can turn into a superstar with good coaching.']);
}
function mentorFA() {
  mentor('fa', ['Free agency. The shopping mall of football.', 'Veterans cost more than rookies, but they can help you win right now. Just mind the salary cap.', "When you're done shopping, start the new season from Home. Whoever's left signs with other teams."]);
}
function mentorTip() {
  const t = userTeam(), u = units(t), d = depth(t);
  const injured = t.roster.filter(p => p.inj > 0 && p.ovr >= u.ovr - 3);
  const stad = FAC.stadium.cost[t.stadium + 1];
  if (G.cash < 0) return "You're in debt. Every week costs you interest. Cut salary or raise revenue, fast.";
  if (G.phase === 'preseason' && rosterProblems(t).length) return "Your roster's not legal yet. Fix it before the season starts.";
  if (G.phase === 'resign') return "Re-sign your young studs. Let the old guys with big asks walk. Loyalty doesn't win football games.";
  if (G.phase === 'draft') return "Draft for potential, not just today's rating. And upgrade your scouting if those estimates look fuzzy.";
  if (G.phase === 'fa') return 'Free agency is where you plug holes. Look for the best rating per dollar, not the biggest name.';
  if (t.ticket > fairPrice(t) * 1.3) return `Fans are grumbling about $${t.ticket} tickets. Fair price is around $${fairPrice(t)}. Greed empties seats.`;
  if (injured.length) return `${injured[0].pos} ${fullName(injured[0])} is hurt. Check free agency for a fill-in if the backup can't cut it.`;
  if (payroll(t) > SALARY_CAP * 0.95) return "You're right up against the salary cap. No room to sign anybody until some contracts come off the books.";
  if (t.mood < 35) return 'Fans are miserable. Win some games, or at least drop ticket prices to keep the seats full.';
  if ((d.QB[0] ? d.QB[0].ovr : 0) < u.ovr - 3) return "Your quarterback is the weak link. In this league, you don't win without a gunslinger.";
  if (stad && G.cash > stad * 1.6) return `You've got ${fmtM(G.cash)} just sitting there. A stadium upgrade pays for itself in ticket sales.`;
  if (t.medical <= 2 && G.cash > FAC.medical.cost[t.medical + 1] * 2) return 'Cheap insurance: a better Medical Center keeps your stars on the field.';
  return pick([
    'Defense wins championships. Offense sells tickets. Try to have both.',
    "Young players with A or B potential are gold. Train 'em up and watch 'em grow.",
    'Never fall in love with a 31-year-old running back. Trust me on this one.',
    'The draft is the cheapest way to get good. Rookie contracts are a steal.',
    'A full stadium is a happy stadium. Keep an eye on attendance in Finances.',
    "Patience, kid. Dynasties aren't built in one season.",
  ]);
}

    const list = t.roster.slice().sort((a, b) => POS.indexOf(a.pos) - POS.indexOf(b.pos) || b.ovr - a.ovr);
    showModal(`<div class="row mb">${badge(t, 48)}<div><div class="tname">${t.city} ${t.name}</div><div class="sm muted">${recStr(t)} · OVR ${u.ovr} · OFF ${u.off} · DEF ${u.def} · Value ${fmtM(teamValue(t))}</div></div></div>
      <div class="tbl-wrap" style="max-height:60vh;overflow:auto"><table class="tbl"><tr><th>Pos</th><th>Player</th><th class="c">Age</th><th class="c">OVR</th><th class="r">Salary</th></tr>${list.map(p => `<tr><td><span class="pos">${p.pos}</span></td><td>${fullName(p)}${p.inj ? '<span class="tag inj">Inj</span>' : ''}</td><td class="c">${p.age}</td><td class="c">${ovrPill(p.ovr)}</td><td class="r">${fmtM(p.salary)}</td></tr>`).join('')}</table></div>
      <div class="row mt" style="justify-content:flex-end"><button class="btn" onclick="act.closeModal()">Close</button></div>`, true);
  },
};
window.act = act;
document.addEventListener('keydown', e => {
  if (Talk.active) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); talkNext(); } else if (e.key === 'Escape') closeTalk(); return; }
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if ($('#modal-root').innerHTML) { if (k === 'escape') act.closeModal(); return; }
  const L = UI.live;
  if (L) {
    if (L.g.over) { if (k === 'enter' || k === ' ') { e.preventDefault(); act.finishLive(); } return; }
    const need = needInput();
    if (need && /^[1-5]$/.test(k)) { const c = (need === 'off' ? OFF_KEYS : DEF_KEYS)[+k - 1]; if (c && !(c === 'fg' && L.g.fgDist() > 66)) act.call(c); return; }
    if (k === 'a' && G.coachMode) act.autoDrive();
    else if (k === 'e') act.simEnd();
    else if (k === ' ' && !G.coachMode) { e.preventDefault(); act.pause(); }
    return;
  }
  if (!G || G.user == null) return;
  if (/^[0-9]$/.test(k)) { const v = NAV[(+k + 9) % 10]; if (v) act.nav(v[0]); }
  else if (k === 'g' && userGameNow()) act.playLive();
  else if (k === 's' && userGameNow()) act.quickSim();
  else if (k === 'b') act.callBuck();
});

/* ================= BOOT ================= */
// save on the way out and, while a career is open, ask before the tab closes
window.addEventListener('beforeunload', e => {
  if (!G) return;
  save();
  if (!setting('confirmLeave')) return;
  e.preventDefault();
  e.returnValue = '';
});

SAVED = peekSave();
render();
(function intro() {
  const sp = document.getElementById('splash'); if (!sp) return;
  let gone = false;
  const skip = e => { if (e && e.type === 'keydown') e.stopImmediatePropagation(); end(); };
  const end = () => {
    if (gone) return; gone = true;
    document.removeEventListener('keydown', skip, true);
    sp.classList.add('out'); setTimeout(() => sp.remove(), 650);
  };
  sp.addEventListener('click', end);
  document.addEventListener('keydown', skip, true);
  setTimeout(end, 3600);
})();
</script>
